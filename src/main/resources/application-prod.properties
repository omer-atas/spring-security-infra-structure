spring.jpa.hibernate.ddl-auto=validate
app.security.seed-data-enabled=false
app.security.jwt.rsa-private-key-pem=${JWT_RSA_PRIVATE_KEY:}
app.security.jwt.rsa-public-key-pem=${JWT_RSA_PUBLIC_KEY:}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.cors.allowed-origin-patterns[0]=${CORS_ALLOWED_ORIGIN_PATTERNS:https://app.example.com}