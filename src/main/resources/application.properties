spring.application.name=spring-security-tutorial
spring.profiles.default=dev
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:security}
spring.datasource.username=${POSTGRES_USER:security}
spring.datasource.password=${POSTGRES_PASSWORD:security}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.server.port=${MANAGEMENT_PORT:9091}
app.security.jwt.issuer=spring-security-tutorial
app.security.jwt.audience=spring-security-tutorial-api
app.security.jwt.access-token-ttl=PT15M
app.security.refresh-token.ttl=P7D
app.security.session.absolute-timeout=PT8H
app.security.session.idle-timeout=PT30M
app.security.session.activity-update-interval=PT2M
app.security.session.warning-before=PT2M
app.security.cors.allowed-origin-patterns[0]=http://localhost:3000
app.security.login-throttle.max-attempts=5
app.security.login-throttle.window=PT5M
app.security.rate-limit.capacity=20
app.security.rate-limit.refill-tokens=10
app.security.rate-limit.refill-period=PT1M
app.security.rate-limit.cache-maximum-size=10000
app.security.rate-limit.cache-expire-after-access=PT10M
app.security.rate-limit.endpoints[/api/auth/login].capacity=5
app.security.rate-limit.endpoints[/api/auth/login].refill-tokens=5
app.security.rate-limit.endpoints[/api/auth/login].refill-period=PT1M
app.security.rate-limit.endpoints[/api/auth/refresh].capacity=10
app.security.rate-limit.endpoints[/api/auth/refresh].refill-tokens=10
app.security.rate-limit.endpoints[/api/auth/refresh].refill-period=PT1M
app.security.rate-limit.endpoints[/api/v1/orders].capacity=30
app.security.rate-limit.endpoints[/api/v1/orders].refill-tokens=30
app.security.rate-limit.endpoints[/api/v1/orders].refill-period=PT1M
app.security.rate-limit.endpoints[/api/users].capacity=20
app.security.rate-limit.endpoints[/api/users].refill-tokens=20
app.security.rate-limit.endpoints[/api/users].refill-period=PT1M
app.security.rate-limit.endpoints[/api/roles].capacity=20
app.security.rate-limit.endpoints[/api/roles].refill-tokens=20
app.security.rate-limit.endpoints[/api/roles].refill-period=PT1M
app.security.rate-limit.endpoints[/api/admin].capacity=30
app.security.rate-limit.endpoints[/api/admin].refill-tokens=30
app.security.rate-limit.endpoints[/api/admin].refill-period=PT1M
app.security.rate-limit.endpoints[/api/webhooks].capacity=50
app.security.rate-limit.endpoints[/api/webhooks].refill-tokens=50
app.security.rate-limit.endpoints[/api/webhooks].refill-period=PT1M
app.security.webhook-signature.ttl=PT5M
app.security.request-body.max-size=1MB
app.security.retention.session=P30D
app.security.retention.refresh-token=P30D
app.security.retention.audit=P180D
app.security.access-token-blacklist.ttl=PT15M
app.security.seed-data-enabled=true