services:
  postgres:
    image: postgres:16-alpine
    container_name: security-tutorial-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security}
      POSTGRES_USER: ${POSTGRES_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - security_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: security-tutorial-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - security_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  security_pgdata:
  security_redisdata:
